; POLARITY – a magnetic multiplayer browser game hosted on an ESP32
; Default upload: USB.  OTA afterwards: pio run -e ota -t upload

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
lib_deps =
    links2004/WebSockets@^2.4.1
build_flags =
    -DWEBSOCKETS_SERVER_CLIENT_MAX=8

; Over-the-air updates (same firewall rule as GreenGuardian: host port 8266)
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = polarity.local
upload_flags =
    --auth=polarity
    --host_port=8266
